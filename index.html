<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Долина единорогов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marmelad&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2358; --ink-soft:#6b5490;
  --paper:#fff6fb; --panel:#fffdfe; --panel-edge:#ecd6f3;
  --accent:#e5489b; --accent-ink:#ffffff; --violet:#7a5cf0; --gold:#f5b938;
  --sky1:#9fc4ff; --sky2:#ffd3ea; --sky3:#fff0d2;
  --hill1:#b9a8f2; --hill2:#8fd9b6; --grass1:#93e3a9; --grass2:#64cb8d;
  --sand:#f7e1b3; --sand2:#e8c78a;
  --castle:#f1e6ff; --castle2:#c79bf2; --sun:#fff3a6; --cloud:#ffffff;
  --star-op:0;
  --wood1:#efc195; --wood2:#dba473; --straw:#f8dc8e; --straw2:#e9c365;
  --wall1:#ffe7f2; --wall2:#ffd3e6; --floor:#edcfa6; --floor2:#dfb987;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#f4ecff; --ink-soft:#c9b8ec;
    --paper:#18132f; --panel:#2a2152; --panel-edge:#4b3e88;
    --accent:#ff78b9; --accent-ink:#3a1030; --violet:#a994ff; --gold:#ffd166;
    --sky1:#120e2e; --sky2:#33266e; --sky3:#7b4a9d;
    --hill1:#3a2f78; --hill2:#245b5d; --grass1:#2b6d62; --grass2:#1f574f;
    --sand:#8a79a6; --sand2:#73639a;
    --castle:#5b4b9c; --castle2:#8a6bd6; --sun:#f4f0ff; --cloud:#5a4d94;
    --star-op:1;
    --wood1:#6a4a5f; --wood2:#553a4e; --straw:#a88d5a; --straw2:#8c7446;
    --wall1:#3a2d66; --wall2:#32265a; --floor:#5c4668; --floor2:#4b3857;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f4ecff; --ink-soft:#c9b8ec;
  --paper:#18132f; --panel:#2a2152; --panel-edge:#4b3e88;
  --accent:#ff78b9; --accent-ink:#3a1030; --violet:#a994ff; --gold:#ffd166;
  --sky1:#120e2e; --sky2:#33266e; --sky3:#7b4a9d;
  --hill1:#3a2f78; --hill2:#245b5d; --grass1:#2b6d62; --grass2:#1f574f;
  --sand:#8a79a6; --sand2:#73639a;
  --castle:#5b4b9c; --castle2:#8a6bd6; --sun:#f4f0ff; --cloud:#5a4d94;
  --star-op:1;
  --wood1:#6a4a5f; --wood2:#553a4e; --straw:#a88d5a; --straw2:#8c7446;
  --wall1:#3a2d66; --wall2:#32265a; --floor:#5c4668; --floor2:#4b3857;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
h1,h2,.disp{font-family:"Marmelad","Trebuchet MS",system-ui,sans-serif;font-weight:400;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* fills that follow the theme */
.f-sky1{fill:var(--sky1)}.f-hill1{fill:var(--hill1)}.f-hill2{fill:var(--hill2)}
.f-grass1{fill:var(--grass1)}.f-grass2{fill:var(--grass2)}.f-sand{fill:var(--sand)}.f-sand2{fill:var(--sand2)}
.f-castle{fill:var(--castle)}.f-castle2{fill:var(--castle2)}.f-sun{fill:var(--sun)}.f-cloud{fill:var(--cloud)}
.f-wood1{fill:var(--wood1)}.f-wood2{fill:var(--wood2)}.f-straw{fill:var(--straw)}.f-straw2{fill:var(--straw2)}
.f-wall1{fill:var(--wall1)}.f-wall2{fill:var(--wall2)}.f-floor{fill:var(--floor)}.f-floor2{fill:var(--floor2)}
.s-sky1{stop-color:var(--sky1)}.s-sky2{stop-color:var(--sky2)}.s-sky3{stop-color:var(--sky3)}
.nstar{fill:#fff;opacity:var(--star-op)}

#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:.35rem .6rem;padding:.4rem .7rem;
  background:var(--panel);border-bottom:2px solid var(--panel-edge);position:relative;z-index:5}
.topbar h1{font-size:1.25rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:2px solid var(--panel-edge);background:var(--paper);border-radius:999px;padding:.3rem .8rem;font-weight:800}
.pill:hover{border-color:var(--accent)}
.starbox{font-weight:800;white-space:nowrap}
.meters{display:flex;gap:.5rem}
.meter{display:flex;align-items:center;gap:.25rem;font-size:.8rem;font-weight:800}
.meter .bar{width:64px;height:10px;border-radius:6px;background:var(--panel-edge);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.meter.low .bar i{background:var(--gold)}
@media (max-width:760px){
  .meters{order:9;flex-basis:100%;justify-content:space-between}
  .meter .lbl{display:none}
  .meter{flex:1}.meter .bar{flex:1;width:auto}
}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* buttons */
.btn{border:0;border-radius:999px;padding:.7rem 1.6rem;font-weight:800;font-size:1.1rem;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.quiet{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--panel-edge)}
.btn[disabled]{opacity:.45;cursor:default}

/* title + pick screens */
.skybg{background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--sky3))}
.title{align-items:center;justify-content:center;gap:1rem;padding:1rem;text-align:center;overflow:auto}
.title h2{font-size:clamp(2.2rem,7vw,4.2rem);line-height:1;text-shadow:0 3px 0 var(--panel)}
.title p{margin:0;max-width:30rem;font-size:1.1rem}
.title .art{width:min(72vw,420px);max-height:42vh}
.title .art svg{width:100%;height:100%;max-height:42vh}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.pick{align-items:center;justify-content:safe center;gap:.9rem;padding:1rem;overflow:auto}
.pick h2{font-size:clamp(1.6rem,4.5vw,2.4rem);text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;width:min(100%,820px)}
.cards.three{grid-template-columns:repeat(3,1fr);width:min(100%,700px)}
@media (max-width:640px){.cards,.cards.three{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:3px solid var(--panel-edge);border-radius:26px 26px 26px 8px;padding:.6rem .5rem .7rem;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;transition:transform .15s}
.card svg{width:100%;height:min(30vh,230px)}
.cards.three .card svg{height:min(19vh,170px)}
.card b{font-family:"Marmelad","Trebuchet MS",sans-serif;font-weight:400;font-size:1.3rem}
.card small{color:var(--ink-soft);font-size:.85rem}
.card[aria-pressed="true"]{border-color:var(--accent);transform:translateY(-5px);box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.namebox{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center;font-weight:800}
.namebox input{border:2px solid var(--panel-edge);background:var(--panel);border-radius:14px;padding:.45rem .7rem;width:11rem;user-select:text;-webkit-user-select:text}

/* hub */
.hub{flex:1;overflow:hidden;position:relative;background:var(--grass1)}
.scene{display:block;width:100%;height:100%;overflow:visible}
.spot{cursor:pointer;outline:none}
.spot .art{transition:transform .18s}
.spot:hover .art,.spot:focus-visible .art{transform:translateY(-7px)}
.lbl rect{fill:var(--accent)}
.lbl text{fill:var(--accent-ink);font:800 20px "Nunito","Trebuchet MS",sans-serif}
.spot:focus-visible .lbl rect{stroke:var(--gold);stroke-width:4}
.cloud{animation:drift 60s linear infinite alternate}
@keyframes drift{to{transform:translateX(120px)}}

/* unicorn + girl art */
.uni,.girl{display:block;overflow:visible}
.uni .leg{transform-box:fill-box;transform-origin:50% 8%}
.uni .tail{transform-box:fill-box;transform-origin:92% 8%;animation:sway 3.2s ease-in-out infinite}
.uni .eye-open{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
.uni .eye-joy{display:none}
.uni.joy .eye-open{display:none}.uni.joy .eye-joy{display:block}
.uni .wing{transform-box:fill-box;transform-origin:95% 95%;animation:flap 2.4s ease-in-out infinite}
.uni.run .l1{animation:gal .44s linear infinite}
.uni.run .l2{animation:gal .44s linear -.22s infinite}
.uni.run .l3{animation:gal .44s linear -.11s infinite}
.uni.run .l4{animation:gal .44s linear -.33s infinite}
.uni.run .tail{animation:sway .5s ease-in-out infinite}
.uni.air .l1{animation:none;transform:rotate(38deg)}
.uni.air .l3{animation:none;transform:rotate(28deg)}
.uni.air .l2{animation:none;transform:rotate(-48deg)}
.uni.air .l4{animation:none;transform:rotate(-36deg)}
.uni.chew .headg{transform-origin:270px 112px;animation:chew .3s ease-in-out 3}
@keyframes gal{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}

/* stable + house */
.room{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
.room .bg{position:absolute;inset:0;width:100%;height:100%}
.room .who{position:absolute;inset:5% 4% 3%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.room .who svg{height:100%;width:auto;max-width:100%;pointer-events:auto}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;top:5%;right:4%;max-width:46%;background:var(--panel);border:2px solid var(--panel-edge);border-radius:20px 20px 20px 4px;
  padding:.5rem .8rem;font-weight:800;pointer-events:none}
.tray{flex:none;background:var(--panel);border-top:2px solid var(--panel-edge)}
.opts{min-height:3.5rem;display:flex;gap:.4rem .5rem;flex-wrap:wrap;align-items:center;justify-content:center;padding:.5rem .6rem .2rem}
.opts .hint{color:var(--ink-soft);text-align:center}
.opts .grp{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;justify-content:center;flex-basis:100%}
.opts .grp>span{font-size:.85rem;color:var(--ink-soft);min-width:4.6rem;text-align:right}
.chip{border:2px solid var(--panel-edge);background:var(--paper);border-radius:999px;padding:.32rem .8rem;font-weight:800}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid var(--panel-edge);background:var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.12)}
.food{border:2px solid var(--panel-edge);background:var(--paper);border-radius:18px;padding:.25rem .7rem;font-weight:800;display:flex;align-items:center;gap:.35rem}
.food i{font-style:normal;font-size:1.6rem;line-height:1}
.tools{display:flex;gap:.35rem;padding:.4rem .5rem .55rem;overflow-x:auto;justify-content:safe center}
.tool{flex:none;border:2px solid transparent;background:none;border-radius:16px;padding:.25rem .55rem;display:flex;flex-direction:column;align-items:center;font-size:.8rem;font-weight:800;min-width:4.4rem}
.tool i{font-style:normal;font-size:1.7rem;line-height:1.15}
.tool[aria-pressed="true"]{background:var(--paper);border-color:var(--accent)}
.heart,.bub,.spark,.fly{position:absolute;pointer-events:none}
.heart{font-size:1.6rem;animation:rise 1s ease-out forwards}
.bub{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#d8f3ff 45%,#9ed8ff);opacity:.9;animation:foam 1.6s ease-out forwards}
.spark{color:var(--gold);font-size:1.3rem;animation:twinkle .8s ease-out forwards}
.fly{position:fixed;font-size:2.2rem;z-index:20;transition:left .6s cubic-bezier(.3,.6,.4,1),top .6s cubic-bezier(.3,-.4,.5,1),transform .6s}
@keyframes rise{from{transform:translate(-50%,-50%) scale(.6);opacity:1}to{transform:translate(-50%,-190%) scale(1.25);opacity:0}}
@keyframes foam{0%{transform:translate(-50%,-50%) scale(.3)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:.9}100%{transform:translate(-50%,-90%) scale(1.15);opacity:0}}
@keyframes twinkle{from{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}to{transform:translate(-50%,-120%) scale(1.5) rotate(90deg);opacity:0}}
#sponge{position:fixed;font-size:2.4rem;pointer-events:none;z-index:15;transform:translate(-50%,-50%);display:none}
.sleep{position:absolute;inset:0;background:#120e2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  opacity:0;pointer-events:none;transition:opacity .6s;z-index:8;font-size:1.4rem}
.sleep.on{opacity:.93;pointer-events:auto}
.sleep span{font-size:4rem}

/* track */
#trkView{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:linear-gradient(var(--sky1),var(--sky2) 60%,var(--sky3) 82%)}
#trkStage{position:absolute;left:0;top:0;transform-origin:0 0}
.lay{position:absolute;left:0;display:flex;will-change:transform}
.lay svg{flex:none;display:block;margin-right:-1px}
#trkGround{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--grass1) 0 12px,var(--sand) 12px 86px,var(--grass2) 86px)}
#layGr{top:0}
#runner{position:absolute;left:0;top:0;width:190px;height:172px;transform-origin:50% 62%;will-change:transform}
#runner svg{width:100%;height:100%}
#rshadow{position:absolute;left:0;top:0;width:150px;height:16px;border-radius:50%;background:#000;opacity:.16}
.ob{position:absolute;left:0;top:0;visibility:hidden;will-change:transform}
.ob svg{display:block;overflow:visible}
.ob-fence svg{transform-origin:50% 100%;transition:transform .35s,opacity .35s}
.ob-fence.hit svg{transform:rotate(78deg);opacity:.7}
.ob-magic svg{animation:shimmer 1.2s ease-in-out infinite}
.ob-magic.hit{opacity:.2;transition:opacity .3s}
.ob-star svg{animation:bob 1.1s ease-in-out infinite}
.ob.got{opacity:0;transition:opacity .2s}
.ob .tip{position:absolute;bottom:106%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--panel);border:2px solid var(--panel-edge);
  border-radius:14px;padding:.2rem .6rem;font-weight:800;font-size:17px}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pop{position:absolute;font:800 26px "Nunito","Trebuchet MS",sans-serif;color:#fff;text-shadow:0 2px 0 var(--accent),0 0 8px var(--accent);white-space:nowrap;
  animation:popup .9s ease-out forwards;pointer-events:none}
@keyframes popup{from{transform:translateY(0) scale(.7);opacity:1}to{transform:translateY(-70px) scale(1.1);opacity:0}}
.hud{position:absolute;left:.7rem;right:.7rem;top:.6rem;display:flex;align-items:center;gap:.7rem;pointer-events:none}
.hud .cnt{background:var(--panel);border:2px solid var(--panel-edge);border-radius:999px;padding:.2rem .8rem;font-weight:800}
.hud .prog{flex:1;height:12px;border-radius:8px;background:color-mix(in srgb,var(--panel) 70%,transparent);border:2px solid var(--panel-edge);overflow:hidden}
.hud .prog i{display:block;height:100%;width:0;background:var(--accent)}
.ctrl{position:absolute;left:.8rem;right:.8rem;bottom:.8rem;display:flex;justify-content:space-between;pointer-events:none}
.ctrl button{pointer-events:auto;width:6.2rem;height:6.2rem;border-radius:50%;border:4px solid #fff;font-weight:800;font-size:1.05rem;color:#fff;
  background:var(--violet);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.ctrl #btnJump{background:#e5489b}
.ctrl button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:1rem;background:color-mix(in srgb,var(--sky1) 55%,transparent);z-index:6;overflow:auto}
.over.on{display:flex}
.sheet{background:var(--panel);border:3px solid var(--panel-edge);border-radius:30px 30px 30px 10px;padding:1.2rem 1.4rem;max-width:30rem;text-align:center;
  display:flex;flex-direction:column;gap:.7rem;align-items:center}
.sheet h2{font-size:1.9rem}
.sheet p{margin:0}
.sheet ul{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:.3rem}
.sheet .big{font-size:1.3rem;font-weight:800}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 4.2rem);transform:translate(-50%,-20px);background:var(--ink);color:var(--paper);
  padding:.5rem 1rem;border-radius:999px;font-weight:800;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .uni .tail,.uni .eye-open,.uni .wing,.cloud,.ob-magic svg,.ob-star svg{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gRainbow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fa8"/><stop offset=".25" stop-color="#ffc24d"/><stop offset=".5" stop-color="#7be08f"/>
      <stop offset=".75" stop-color="#63c1ff"/><stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <linearGradient id="gMagic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/><stop offset=".35" stop-color="#7fe6ff"/><stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <linearGradient id="gWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfeaff"/><stop offset="1" stop-color="#e3c8ff"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="s-sky1"/><stop offset=".65" class="s-sky2"/><stop offset="1" class="s-sky3"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <button class="pill" id="btnBack" hidden>‹ Во двор</button>
    <h1 id="ttl">Долина единорогов</h1>
    <div class="meters" id="meters" hidden></div>
    <span class="starbox" id="starBox" hidden>⭐ <span id="starN">0</span></span>
    <button class="pill" id="btnSnd" aria-label="Выключить звук">🔊</button>
  </header>
  <main>
    <section class="screen title skybg" data-screen="title">
      <div class="art" id="titleArt"></div>
      <h2>Долина единорогов</h2>
      <p>Выбери наездницу и единорога, ухаживай за ним в конюшне и прыгай через волшебные барьеры на треке.</p>
      <div class="row" id="titleBtns"></div>
    </section>

    <section class="screen pick skybg" data-screen="girl">
      <h2>Кем ты будешь играть?</h2>
      <div class="cards" id="girlCards"></div>
      <div class="row"><button class="btn" id="girlNext" disabled>Дальше</button></div>
    </section>

    <section class="screen pick skybg" data-screen="uni">
      <h2>Выбери своего единорога</h2>
      <div class="cards three" id="uniCards"></div>
      <label class="namebox">Как её зовут? <input id="uniName" maxlength="14" autocomplete="off"></label>
      <div class="row"><button class="btn quiet" id="uniBack">Назад</button><button class="btn" id="uniNext" disabled>Играть</button></div>
    </section>

    <section class="screen" data-screen="hub"><div class="hub" id="hub"></div></section>

    <section class="screen" data-screen="stable">
      <div class="room" id="stScene">
        <div id="stBg"></div>
        <div class="who" id="stUni"></div>
        <div class="bubble" id="stSay"></div>
        <div class="fx" id="stFx"></div>
      </div>
      <div class="tray">

  lastFx=now; const sr=$('#stScene').getBoundingClientRect(),x=e.clientX-sr.left,y=e.clientY-sr.top,u=$('#stUni svg');
  if(tool==='pet'){fx('heart',pick(['💗','💖','💕']),x+rnd(-12,12),y-10);bump('happy',1.3);u.classList.add('joy');clearTimeout(joyT);joyT=setTimeout(()=>u.classList.remove('joy'),700);
    if(Math.random()<.35)sfx.pet(); if(S.stats.happy>=100)say('Я самая счастливая!');}
  else{fx('bub','',x+rnd(-16,16),y+rnd(-16,16));fx('bub','',x+rnd(-26,26),y+rnd(-26,26));bump('clean',1.600);
    const d=$('#stUni .dirt');d&&d.setAttribute('opacity',dirtLevel().toFixed(2)); if(Math.random()<.4)sfx.wash();
    if(S.stats.clean>=100&&!wasClean){wasClean=true;const r=u.getBoundingClientRect();
      for(let i=0;i<12;i++)fx('spark','✦',r.left-sr.left+rnd(.15,.9)*r.width,r.top-sr.top+rnd(.1,.85)*r.height);
      sfx.trick();bump('happy',6);say('Я сияю чистотой!');}}
  updMeters();
}
const stScene=$('#stScene');
stScene.addEventListener('pointerdown',e=>{down=true;rub(e);});
stScene.addEventListener('pointermove',e=>{
  if(tool==='wash'){const s=$('#sponge');s.style.display='block';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';}
  if(down||(tool==='pet'&&e.pointerType==='mouse'&&e.buttons))rub(e);
});
stScene.addEventListener('pointerleave',()=>{$('#sponge').style.display='none'});
window.addEventListener('pointerup',()=>{if(down){down=false;save();}});
window.addEventListener('pointercancel',()=>{down=false});

/* ---------- house ---------- */

    <g transform="translate(548 300)"><rect x="-6" y="-56" width="20" height="170" rx="8" fill="#b57be8"/><rect x="0" y="40" width="246" height="74" rx="14" fill="#b57be8"/><rect x="8" y="14" width="234" height="60" rx="22" fill="#fff"/>

function enterHouse(){
  $('#hsBg').innerHTML=houseBg(); $('#hsSleep').classList.remove('on');
  $('#hsGirl').innerHTML=girlSVG(girl(),S.outfit);
  $('#hsOpts').innerHTML='<span class="hint">Наряд:</span>'+OUTFITS.map((o,i)=>`<button class="sw" data-o="${i}" style="--c:${o.dress}" aria-label="${o.name}" title="${o.name}" aria-pressed="${S.outfit===i}"></button>`).join('');
}
$('#hsOpts').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;S.outfit=+b.dataset.o;save();sfx.tap();enterHouse();};
$('#hsSleepBtn').onclick=()=>{const s=$('#hsSleep');if(s.classList.contains('on'))return;s.classList.add('on');tone(520,.5,'sine',.05,.6);
  setTimeout(()=>{S.stats.energy=100;bump('happy',5);bump('food',-8);save();updMeters();s.classList.remove('on');if(cur==='house')toast(`Доброе утро! ${uname()} отдохнула и полна сил.`);},2000);};
$('#hsRepick').onclick=()=>{sfx.tap();pickG=S.girl;pickU=S.uni;go('girl');};

/* ---------- track ---------- */
const FAR=`<svg width="800" height="260" viewBox="0 0 800 260"><path class="f-hill1" d="M0 260V170Q60 120 120 150Q190 60 260 140Q320 100 380 150Q450 40 530 130Q600 90 660 140Q730 110 800 170V260Z"/>
  <path d="M176 92Q190 70 204 90L190 84ZM436 66Q450 40 466 64L450 58Z" fill="#fff" opacity=".7"/>
  <g transform="translate(600 96)"><rect class="f-castle" x="-18" y="0" width="36" height="46"/><rect class="f-castle" x="-28" y="-12" width="12" height="58"/><rect class="f-castle" x="16" y="-12" width="12" height="58"/><path class="f-castle2" d="M-31 -12L-22 -30L-13 -12ZM13 -12L22 -30L31 -12ZM-10 0L0 -22L10 0Z"/></g></svg>`;
const MID=`<svg width="600" height="140" viewBox="0 0 600 140"><path class="f-hill2" d="M0 140V70Q75 30 150 60Q225 90 300 55Q375 20 450 60Q525 95 600 70V140Z"/>
  <g class="f-grass2"><circle cx="110" cy="40" r="22"/><circle cx="132" cy="52" r="16"/><circle cx="420" cy="34" r="24"/><circle cx="396" cy="48" r="16"/></g>
  <path d="M112 58V84M418 54V80" stroke="#8a5a3c" stroke-width="7" stroke-linecap="round"/></svg>`;
const GRT=`<svg width="240" height="96" viewBox="0 0 240 96"><path class="f-grass2" d="M10 12l6 -12l5 12zM120 12l6 -11l5 11zM196 12l5 -9l5 9z"/><rect class="f-sand2" x="30" y="46" width="70" height="6" rx="3"/><rect class="f-sand2" x="160" y="62" width="40" height="5" rx="2.500"/>
  <circle cx="70" cy="92" r="4" fill="#ff8cc6"/><circle cx="180" cy="90" r="4" fill="#ffe36e"/></svg>`;
const OB={
  fence:{w:46,h:64,svg:`<svg width="46" height="64" viewBox="0 0 46 64"><rect x="2" y="6" width="9" height="58" rx="4" fill="#fff"/><rect x="35" y="6" width="9" height="58" rx="4" fill="#fff"/><rect y="13" width="46" height="10" rx="5" fill="#ff8cc6"/><rect y="35" width="46" height="10" rx="5" fill="#7a5cf0"/><circle cx="6.500" cy="5" r="5" fill="#f5b938"/><circle cx="39.500" cy="5" r="5" fill="#f5b938"/></svg>`},
  magic:{w:50,h:170,svg:`<svg width="50" height="170" viewBox="0 0 50 170"><rect x="9" y="14" width="32" height="156" rx="16" fill="url(#gMagic)" opacity=".88"/><rect x="17" y="24" width="6" height="136" rx="3" fill="#fff" opacity=".55"/>
    <path d="M0 170L8 144L16 170ZM34 170L42 144L50 170Z" fill="#b58cff"/>${star(25,12,1.600,'#fff6a8')}<circle cx="34" cy="60" r="3" fill="#fff"/><circle cx="30" cy="110" r="2.500" fill="#fff"/><circle cx="36" cy="140" r="2" fill="#fff"/></svg>`},
  hoop:{w:60,h:140,svg:`<svg width="60" height="140" viewBox="0 0 60 140"><ellipse cx="30" cy="70" rx="22" ry="63" fill="none" stroke="url(#gRainbow)" stroke-width="10"/><ellipse cx="30" cy="70" rx="22" ry="63" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>${star(30,2,.9,'#fff6a8')}</svg>`},
  star:{w:36,h:36,svg:`<svg width="36" height="36" viewBox="-12 -12 24 24"><path d="${STAR}" fill="#ffd23c" stroke="#fff" stroke-width="1.400" stroke-linejoin="round"/></svg>`},
  puddle:{w:120,h:20,svg:`<svg width="120" height="20" viewBox="0 0 120 20"><ellipse cx="60" cy="11" rx="59" ry="9" fill="#8a5a3c"/><ellipse cx="48" cy="9" rx="30" ry="4" fill="#b07a55"/></svg>`},
  finish:{w:130,h:250,svg:`<svg width="130" height="250" viewBox="0 0 130 250"><rect x="4" y="10" width="9" height="240" rx="4" fill="#fff"/><rect x="117" y="10" width="9" height="240" rx="4" fill="#fff"/>
    <path d="M8 14H122V58Q65 74 8 58Z" fill="#e5489b"/><text x="65" y="46" text-anchor="middle" fill="#fff" font-family="Nunito,Trebuchet MS,sans-serif" font-weight="800" font-size="24">ФИНИШ</text>${star(8,8,1.200,'#ffe36e')}${star(122,8,1.200,'#ffe36e')}</svg>`}
};
const UX=70,RW=190,RH=172,RFOOT=18;
const T={on:false,raf:0,objs:[],sc:1,W:800,H:560,gy:464};
const runner=$('#runner'),objsEl=$('#objs'),trkFx=$('#trkFx');
function fillLay(sel,svg,tw,top){const el=$(sel),n=Math.ceil(T.W/tw)+2;el.innerHTML=svg.repeat(n);if(top!=null)el.style.top=top+'px';el.dataset.tw=tw-1;}
function topOf(o){
  if(o.type==='star')return T.gy-o.hy-18;
  if(o.type==='hoop')return T.gy-o.cy-70;
  if(o.type==='puddle')return T.gy+6;
  return T.gy-o.h;
}
function sizeTrack(){
  const v=$('#trkView'),w=v.clientWidth,h=v.clientHeight; if(!w||!h)return;
  T.sc=Math.min(h/560,w/600);T.W=w/T.sc;T.H=h/T.sc;T.sf=clamp(T.W/800,.75,1);
  const port=w<h; T.gy=T.H-96-(port?Math.min(132/T.sc,T.H*.3):0);
  const st=$('#trkStage');st.style.width=T.W+'px';st.style.height=T.H+'px';st.style.transform=`scale(${T.sc})`;
  fillLay('#layFar',FAR,800,T.gy-262);fillLay('#layMid',MID,600,T.gy-136);fillLay('#layGr',GRT,240,null);
  $('#trkGround').style.top=(T.gy-22)+'px';$('#trkGround').style.height=(T.H-T.gy+22)+'px';
  T.objs.forEach(o=>o.top=topOf(o));
  placeRunner(0);
}
function placeRunner(ang){
  runner.style.transform=`translate(${UX}px,${T.gy-RH+RFOOT-(T.y||0)}px) rotate(${ang}deg)`;
  const k=clamp(1-(T.y||0)/320,.35,1);
  $('#rshadow').style.transform=`translate(${UX+20+75*(1-k)}px,${T.gy-6}px) scale(${k},1)`;
}
function mk(type,x,extra){const el=document.createElement('div');el.className='ob ob-'+type;el.innerHTML=OB[type].svg;objsEl.appendChild(el);
  const o=Object.assign({type,x,el,done:false,w:OB[type].w,h:OB[type].h},extra||{});o.top=topOf(o);T.objs.push(o);return o;}
function genCourse(){
  T.objs=[];objsEl.innerHTML='';
  let x=1150,hinted=false;const first=['fence','stars','fence','magic'],bag=['fence','fence','magic','hoop','puddle','stars','fence','magic','hoop','puddle'];
  for(let i=0;i<17;i++){
    const t=i<first.length?first[i]:pick(bag);
    if(t==='fence'){mk('fence',x);mk('star',x+5,{hy:170});}
    else if(t==='magic'){const m=mk('magic',x);mk('star',x+7,{hy:292});if(!hinted){hinted=true;m.el.insertAdjacentHTML('beforeend','<span class="tip">Прыгни два раза!</span>');}}
    else if(t==='hoop')mk('hoop',x,{cy:215});
    else if(t==='puddle')mk('puddle',x);
    else{mk('star',x,{hy:150});mk('star',x+100,{hy:200});mk('star',x+200,{hy:150});x+=200;}
    if(Math.random()<.6)mk('star',x+320,{hy:60});
    x+=rnd(620,820);
  }
  T.finish=x+150;mk('finish',T.finish);
}
function drawRunner(){runner.innerHTML=uniSVG(uniOpts({rider:girl(),outfit:S.outfit,shadow:false,cls:T.on?'run':'',dirt:clamp(dirtLevel()+(T.mud||0)*.3,0,1)}));}
function enterTrack(){
  T.on=false;T.y=0;T.mud=0;T.objs=[];objsEl.innerHTML='';trkFx.innerHTML='';
  sizeTrack();drawRunner();placeRunner(0);
  $('#runStars').textContent='0';$('#runProg').style.width='0';
  const sh=$('#trkSheet'),low=S.stats.energy<12;
  sh.innerHTML=low
    ?`<h2>${esc(uname())} устала</h2><p>Пусть отдохнёт дома или перекусит в конюшне — и снова на трек.</p><div class="row"><button class="btn" data-a="house">В дом</button><button class="btn quiet" data-a="stable">В конюшню</button></div>`
    :`<h2>На старт!</h2><ul><li><b>Прыжок</b> — пробел или касание экрана.</li><li><b>Два прыжка подряд</b> — высокий прыжок через волшебный барьер.</li><li><b>Трюк</b> — клавиша X: в воздухе сальто, на земле свечка.</li><li>Собирай звёзды и не наступай в лужи.</li></ul><div class="row"><button class="btn" data-a="start">Поехали</button></div>`;
  $('#trkOver').classList.add('on');
}
$('#trkSheet').onclick=e=>{const b=e.target.closest('button');if(!b)return;sfx.tap();const a=b.dataset.a;
  if(a==='start')trackStart(); else go(a);};
function trackStart(){
  $('#trkOver').classList.remove('on');trkFx.innerHTML='';
  Object.assign(T,{dist:0,y:0,vy:0,ground:true,jumps:0,spin:-1,rear:-1,cd:0,stars:0,cleared:0,tricks:0,mud:0});
  genCourse();T.on=true;drawRunner();$('#runStars').textContent='0';
  T.last=performance.now();cancelAnimationFrame(T.raf);T.raf=requestAnimationFrame(loop);
}
function trackStop(){T.on=false;cancelAnimationFrame(T.raf);}
function loop(t){if(!T.on)return;const dt=Math.min(.05,Math.max(0,(t-T.last)/1000));T.last=t;step(dt);if(T.on)T.raf=requestAnimationFrame(loop);}
function pop(txt,dy){const el=document.createElement('span');el.className='pop';el.textContent=txt;el.style.left=(UX+70)+'px';el.style.top=(T.gy-RH-T.y-18+(dy||0))+'px';
  trkFx.appendChild(el);el.addEventListener('animationend',()=>el.remove());}
function addStars(n){T.stars+=n;$('#runStars').textContent=T.stars;}
function jump(){
  if(!T.on||T.rear>=0&&T.rear<.25)return;
  if(T.ground){T.ground=false;T.vy=760;T.jumps=1;T.rear=-1;sfx.jump();runner.firstElementChild.classList.add('air');}
  else if(T.jumps<2){T.vy=700;T.jumps=2;sfx.jump();pop('✦',30);}
}
function trick(){
  if(!T.on)return;
  if(!T.ground){if(T.spin<0){T.spin=0;sfx.tap();}}
  else if(T.rear<0&&T.cd<=0){T.rear=0;sfx.tap();}
}
function step(dt){
  const prog=clamp(T.dist/T.finish,0,1);T.dist+=(360+90*prog)*(T.sf||1)*dt;
  const svg=runner.firstElementChild;
  if(!T.ground){T.vy-=2000*dt;T.y+=T.vy*dt;
    if(T.y<=0){T.y=0;T.vy=0;T.ground=true;T.jumps=0;svg.classList.remove('air');if(T.spin>=0){T.spin=-1;pop('Почти!');}}}
  let ang=0;
  if(T.spin>=0){T.spin+=dt;const k=Math.min(1,T.spin/.5);ang=360*k;if(k>=1){T.spin=-1;ang=0;T.tricks++;addStars(2);pop('Сальто! +2');sfx.trick();}}
  if(T.rear>=0){T.rear+=dt;const k=Math.min(1,T.rear/.6);ang=-24*Math.sin(Math.PI*k);if(k>=1){T.rear=-1;T.cd=1.200;T.tricks++;addStars(1);pop('Свечка! +1');sfx.trick();}}
  if(T.cd>0)T.cd-=dt;
  placeRunner(ang);
  for(const [sel,f] of [['#layFar',.15],['#layMid',.4],['#layGr',1]]){const el=$(sel),tw=+el.dataset.tw;el.style.transform=`translateX(${-((T.dist*f)%tw)}px)`;}
  $('#runProg').style.width=(prog*100)+'%';
  const hx0=UX+58,hx1=UX+134,cx=UX+95,cyh=T.y+72;
  for(const o of T.objs){
    const sx=o.x-T.dist;
    if(sx<-280){if(!o.gone){o.gone=true;o.el.remove();}continue;}
    if(sx>T.W+220)continue;
    o.el.style.visibility='visible';o.el.style.transform=`translate(${sx}px,${o.top}px)`;
    if(o.done)continue;
    if(o.type==='fence'||o.type==='magic'){
      if(sx<hx1&&sx+o.w>hx0){if(T.y<o.h-18){o.done=true;o.el.classList.add('hit');pop(o.type==='magic'?'Нужно выше!':'Ой!');sfx.hit();}}
      else if(sx+o.w<=hx0){o.done=true;T.cleared++;const n=o.type==='magic'?2:1;addStars(n);pop('+'+n);sfx.star();}
    }else if(o.type==='star'){
      if(Math.abs(sx+18-cx)<62&&Math.abs(o.hy-cyh)<70){o.done=true;o.el.classList.add('got');addStars(1);sfx.star();}
    }else if(o.type==='hoop'){
      if(sx+30<cx){o.done=true;if(Math.abs(o.cy-cyh)<64){addStars(3);T.tricks++;pop('Сквозь кольцо! +3');sfx.trick();}}
    }else if(o.type==='puddle'){
      if(T.y<8&&cx>sx+12&&cx<sx+o.w-12){o.done=true;T.mud++;pop('Плюх!');sfx.hit();const d=svg.querySelector('.dirt');d&&d.setAttribute('opacity',clamp(dirtLevel()+T.mud*.3,0,1).toFixed(2));}
      else if(sx+o.w<hx0)o.done=true;
    }else if(o.type==='finish'){if(sx+60<cx){o.done=true;finish();}}
  }
}
function finish(){
  trackStop();runner.firstElementChild.classList.remove('run','air');runner.firstElementChild.classList.add('joy');T.y=0;placeRunner(0);sfx.win();
  const rec=T.stars>S.best; S.stars+=T.stars;S.best=Math.max(S.best,T.stars);
  bump('energy',-14);bump('food',-10);bump('clean',-8-T.mud*14);bump('happy',Math.min(25,6+T.tricks*2));save();updMeters();
  $('#trkSheet').innerHTML=`<h2>${rec?'Новый рекорд!':'Финиш!'}</h2><p class="big">⭐ ${T.stars}</p>
    <ul><li>Чистых прыжков: <b>${T.cleared}</b></li><li>Трюков: <b>${T.tricks}</b></li><li>Луж: <b>${T.mud}</b>${T.mud?' — пора в конюшню мыться':''}</li><li>Рекорд: <b>${S.best}</b></li></ul>
    <div class="row"><button class="btn" data-a="${S.stats.energy<12?'house':'start'}">${S.stats.energy<12?'Отдохнуть дома':'Ещё раз'}</button><button class="btn quiet" data-a="stable">В конюшню</button></div>`;
  $('#trkOver').classList.add('on');
}
$('#trkView').addEventListener('pointerdown',e=>{if(e.target.closest('button,.over'))return;jump();});
$('#btnJump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
$('#btnTrick').addEventListener('pointerdown',e=>{e.preventDefault();trick();});
window.addEventListener('keydown',e=>{
  if(cur!=='track'||e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(T.on)jump();}
  else if(e.code==='KeyX'||e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();trick();}
  else if(e.code==='Enter'&&!T.on){const b=$('#trkSheet .btn');b&&b.click();}
});
window.addEventListener('resize',()=>{if(cur==='track')sizeTrack();if(cur==='hub')layoutHub();});

/* ---------- boot ---------- */
sndLabel();
go('title');
})();
</script>
